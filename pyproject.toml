[project]
name = "intelligent-candidate-screener"
version = "0.1.0"
description = "Intelligent Candidate Screening System — NUS ISS PLP Practice Module, Group 2"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "matplotlib>=3.10.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pypdf>=6.1.0",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_screener"]

[dependency-groups]
app = [
    "streamlit>=1.40",
]
dev = [
    "ipykernel>=6.30.0",
    "jupyterlab>=4.6.3",
    "nbconvert>=7.16.0",
    "pytest>=8.4.0",
]
ml = [
    "accelerate>=1.1",
    "sentence-transformers>=5",
    "torch>=2.8",
    "transformers>=4.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test but `test_baseline_golden.py` runs on inline synthetic corpora. That is a
# hard requirement, not a nicety: `data/` is git-ignored, and a suite that cannot run
# on a fresh clone will not be run.
addopts = "-q -ra --tb=short"

# Optional groups (plan/2026-09-26-top-down-reset, P0.6). The base suite must pass
# without them: `uv sync` gives the classical stack, `uv sync --all-groups` adds these.
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
