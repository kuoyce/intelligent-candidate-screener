# Chat v3 with Qwen3.5-4B (GGUF) in Docker (plan 2026-10-28-gguf-cross-platform, 02 §3): an
# override of compose.yaml, which it leaves unchanged. Its own image, target llm4b of the
# Dockerfile (Ubuntu 24.04, the published llama.cpp b11896 build for this machine, the 2.74 GB
# model). Contract checks: tests/test_docker_contract.py.
#
#   docker compose -f compose.yaml -f compose.llm4b.yaml build llm4b   # downloads the model once
#   docker compose -f compose.yaml -f compose.llm4b.yaml up -d          # with HR_PORTAL_CHAT_VERSION=v3
#
# or set COMPOSE_FILE in `.env` (see .env.example) and use plain `docker compose` commands.
#
# llm4b shares the app container's network namespace (the facade insists on loopback): the facade
# on 127.0.0.1:8001, llama-server on 127.0.0.1:8002, no published port. app reads only the
# manifest's identity fields, from a copy that Docker fills from the llm4b image into the named
# volume; the volume's name carries the pins (model revision, llama.cpp release), so a pin change
# gets a fresh copy. While llm4b is not running, v3 answers through its marked fallback.

services:
  app:
    environment:
      SCREENER_QWEN_MANIFEST: /opt/qwen35-manifest/manifest.json
    volumes:
      - qwen35-manifest:/opt/qwen35-manifest:ro

  llm4b:
    image: candidate-screener/hiring-desk-llm4b:local
    build:
      context: .
      target: llm4b
    network_mode: "service:app"
    # Like compose.yaml's services; the image's files are world-readable and it writes only /tmp.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # No data folder and no logs: the model service reads only its own image.
    volumes:
      - qwen35-manifest:/opt/qwen35-manifest
    # The image's healthcheck asks the facade (127.0.0.1:8001/v1/models), not Streamlit.
    # SIGTERM stops the facade and its llama-server child together.
    stop_grace_period: 30s

volumes:
  qwen35-manifest:
    name: qwen35-manifest-e87f176-b11896
