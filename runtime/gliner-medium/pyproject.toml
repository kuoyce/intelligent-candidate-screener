[project]
name = "candidate-screener-gliner-medium-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.2.2", "transformers==4.48.3", "gliner==0.2.21",
  "numpy<2", "huggingface-hub>=0.24,<1", "sentencepiece>=0.2,<0.3",
  "protobuf>=4,<6", "spacy==3.8.7", "click==8.1.8",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

# Torch's CPU build on Linux (the Docker image, plan 2026-10-27-docker); macOS and Windows
# keep PyPI's.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
